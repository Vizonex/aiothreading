name: CI

# Copied some materials form aiohttp's workflow since I don't understand workflows 
# as well as some other people might. - Vizonex

on:
  merge_group:
  push:
    branches:
      - 'master'
      - '[0-9].[0-9]+'  # matches to backport branches, e.g. 3.6
    tags: [ 'v*' ]
  pull_request:
    branches:
      - 'master'
      - '[0-9].[0-9]+'
    


jobs:
  test:
    permissions:
      contents: read # to fetch code (actions/checkout) (I'll implement add package uploading later)

    strategy:
      matrix:
        pyver: ['3.9', '3.10', '3.11', '3.12', '3.13']
        no-extensions: ['', 'Y']
        os: [ubuntu, macos, windows]
        experimental: [false]
        exclude:
          - os: macos
            no-extensions: 'Y'
          - os: windows
            no-extensions: 'Y'
          - os: ubuntu
            no-extensions: 'Y'
          
        # XXX: Not ready yet...
        # include:
          # - pyver: pypy-3.9
          #   no-extensions: 'Y'
          #   os: ubuntu
          #   experimental: false
          # - os: ubuntu
            # pyver: "3.14"
            # experimental: true
            # no-extensions: 'Y'
      fail-fast: false
    
    runs-on: ${{ matrix.os }}-latest
    continue-on-error: ${{ matrix.experimental }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
    - name: Setup Python ${{ matrix.pyver }}
      id: python-install
      uses: actions/setup-python@v5
      with:
        allow-prereleases: true
        python-version: ${{ matrix.pyver }}
    - name: Get pip cache dir
      id: pip-cache
      run: |
        echo "dir=$(pip cache dir)" >> "${GITHUB_OUTPUT}"
      shell: bash
    - name: Cache PyPI
      uses: actions/cache@v4.2.3
      with:
        key: pip-ci-${{ runner.os }}-${{ matrix.pyver }}-${{ matrix.no-extensions }}-${{ hashFiles('requirements/*.txt') }}
        path: ${{ steps.pip-cache.outputs.dir }}
        restore-keys: |
            pip-ci-${{ runner.os }}-${{ matrix.pyver }}-${{ matrix.no-extensions }}-
    
    - name: Install dependencies
      run: |
        python -m pip install -r requirements/dev.txt

    - name: Install self
      run: python -m pip install -e .

    - name: Run PyTests
      env:
        COLOR: yes
        PIP_USER: 1
      run: pytest
      shell: bash
    
